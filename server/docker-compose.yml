services:
  mongodb:
    image: mongo:7.0
    container_name: nexa_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: nexa
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nexa_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
